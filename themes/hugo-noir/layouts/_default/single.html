{{ define "main" }}
<div class="w-full max-w-3xl lg:max-w-4xl mx-auto px-4 sm:px-6 py-8 sm:py-12">
    <div class="mx-auto p-4 sm:p-6 md:p-8 border border-border-primary-light dark:border-border-primary-dark rounded-2xl bg-neutral-50 dark:bg-neutral-800 min-w-0">
        <h1 class="text-2xl sm:text-3xl md:text-4xl font-bold mb-4 break-words text-text-primary-light dark:text-text-primary-dark">{{ .Title }}</h1>
        {{ if eq .Section "blogs" }}
            <div class="flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-4 mb-6 sm:mb-8 text-text-secondary-light dark:text-text-secondary-dark">
                <time class="shrink-0" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
                <div class="flex flex-wrap gap-2">
                    {{ range .Params.tags }}
                    <span class="px-2 py-1 bg-bg-primary-light dark:bg-bg-tertiary-dark rounded-md text-xs font-medium text-text-secondary-light dark:text-text-secondary-dark">{{ . }}</span>
                    {{ end }}
                </div>
            </div>
        {{ end }}
        
        <div class="prose prose-invert max-w-none article-content">
            {{ .Content }}
        </div>
    </div>
</div>
{{ end }}
