{{ define "main" }}
<div class="w-full md:w-3/4 lg:w-1/2 mx-auto px-4 py-12">
    <h1 class="text-3xl md:text-5xl font-bold mb-8 md:mb-12 text-text-primary-light dark:text-text-primary-dark">{{ .Title }}</h1>
    
    <div class="grid grid-cols-1 gap-6 md:gap-8 max-w-3xl mx-auto">
        {{ $seminarsData := index site.Data .Language.Lang "seminars" }}
        {{ range $seminarsData.seminars }}
        <a href="{{ .link }}" target="_blank" class="group block">
            <div class="seminar-card overflow-hidden rounded-lg bg-bg-primary-light dark:bg-bg-secondary-dark border border-border-primary-light dark:border-border-primary-dark transition-all duration-300">
                <div class="aspect-video overflow-hidden">
                    <img src="{{ .image }}" alt="{{ .title }}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110">
                </div>
                <div class="p-5 sm:p-6">
                    <p class="text-text-secondary-light dark:text-text-secondary-dark text-sm mb-1.5">
                        <span class="inline-flex items-center gap-1">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                            {{ .date }}
                        </span>
                    </p>
                    <h3 class="text-lg sm:text-xl font-semibold mb-2 text-text-primary-light dark:text-text-primary-dark group-hover:text-accent-light dark:group-hover:text-accent-dark transition-colors duration-200">{{ .title }}</h3>
                    <p class="text-text-secondary-light dark:text-text-secondary-dark text-sm mb-3 line-clamp-2">{{ .summary }}</p>
                    <span class="inline-flex items-center gap-1.5 text-xs font-medium text-accent-light dark:text-accent-dark">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>
                        {{ .platform }}
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="opacity-0 group-hover:opacity-100 transition-all duration-200 -ml-1 group-hover:ml-0"><path d="M7 17l9.2-9.2M17 17V7H7"/></svg>
                    </span>
                </div>
            </div>
        </a>
        {{ end }}
    </div>
</div>

<style>
.seminar-card {
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.seminar-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 20px -8px rgba(0, 0, 0, 0.15);
    border-color: rgba(2, 132, 199, 0.5);
}

html.dark .seminar-card:hover {
    border-color: rgba(14, 165, 233, 0.5);
}

@media (max-width: 639px) {
    .seminar-card:hover {
        transform: none;
    }
}
</style>
{{ end }}
